    rb2.appendChild(btn('Copia de seguridad',false,function(){openBackup();}));
    card.appendChild(rb2);
    var r3=row();r3.style.justifyContent='flex-end';r3.style.marginTop='18px';
    r3.appendChild(btn('Cerrar',true,close));card.appendChild(r3);
  }

  function toast(msg,err){
    var t=T(),d=document.createElement('div');d.textContent=msg;
    d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:120;padding:10px 16px;border-radius:999px;font:600 14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:'+(err?'#E63946':t.text)+';color:'+(err?'#fff':t.bg)+';box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;';
    document.body.appendChild(d);setTimeout(function(){d.remove();},2600);
  }
  window.__t10kQuickBackup=function(){ downloadBackup(function(m,e){toast(m,e);}); };
  window.__t10kOpen=function(kind){
    try{var ae=document.activeElement;if(ae&&ae.tagName==='INPUT')ae.blur();}catch(e){}
    if(kind==='bk'){ window.__t10kQuickBackup(); return; }
    setTimeout(openSettings,60);
  };
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
